name: Generate OpenClash rules

on:
  push:
    branches:
      - main
    paths:
      - direct.conf
      - proxy.conf
      - scripts/generate_openclash.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate OpenClash rule providers
        run: python3 scripts/generate_openclash.py

      - name: Commit generated files
        run: |
          if git diff --quiet -- openclash; then
            echo "OpenClash rules are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openclash/direct.yaml openclash/proxy.yaml
          git commit -m "update generated OpenClash rules"
          git push
